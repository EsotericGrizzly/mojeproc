<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moje Proč – Mise ostrov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0606; --panel:#140d0c; --panel2:#1b1210; --line:#2a1c19; --line2:#3a2622;
  --text:#fff3ee; --muted:#a8918a; --dim:#6f5a54;
  --lime:#ff5a1f; --lime-d:#d91e1e; --lime-bg:rgba(255,90,31,.12);
  --red:#ff6b6b; --amber:#f5c75b;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Space Grotesk",system-ui,sans-serif;background:
  radial-gradient(1200px 600px at 10% -10%,rgba(220,30,20,.26),transparent 60%),
  radial-gradient(900px 500px at 100% 0%,rgba(255,110,20,.18),transparent 60%),
  radial-gradient(900px 600px at 50% 120%,rgba(140,10,40,.30),transparent 60%),var(--bg);
  color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:230px 1fr 330px;min-height:100vh;max-width:1600px;margin:0 auto}
/* sidebar */
.side{padding:28px 18px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(255,90,31,.06),transparent 40%),rgba(10,12,11,.7);display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{font-size:22px;font-weight:600;margin:0 6px 26px;letter-spacing:-.02em}
.logo b{font-weight:700}.logo span{color:var(--lime)}
.navh{font-size:11px;letter-spacing:.12em;color:var(--dim);margin:14px 8px 6px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;border:0;background:none;width:100%;text-align:left}
.nav:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav.on{background:var(--lime);color:#0b0f08}
.nav svg{width:18px;height:18px;flex:none}
.promo{margin-top:auto;padding:18px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line);text-align:center}
.promo p{margin:0 0 12px;font-weight:600;line-height:1.35}
.promo p em{font-style:normal;color:var(--lime)}
/* main */
.main{padding:28px 30px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:22px;font-weight:600;margin:0}
.badge{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--lime);display:inline-block}
.badge.local i{background:var(--amber)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:end;margin-bottom:24px}
.big{font-size:52px;font-weight:600;letter-spacing:-.03em;line-height:1}
.big small{font-size:18px;color:var(--muted);font-weight:500;margin-left:8px;letter-spacing:0}
.sub{color:var(--lime);margin-top:8px;font-size:13px}
.teambar{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.teambar .row{display:flex;justify-content:space-between;margin-bottom:10px;color:var(--muted)}
.teambar .row b{color:var(--text);font-size:20px}
.bar{height:8px;border-radius:99px;background:#2e1f1b;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--lime-d),var(--lime));transition:width .4s}
.bar.lg{height:12px}
.bar.done>i{background:linear-gradient(90deg,#ffd23f,#ff5a1f)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#0b0f08;margin-bottom:12px}
.card .lbl{color:var(--muted);font-size:13px}
.card .val{font-size:26px;font-weight:600;margin:4px 0 10px}
.card .val small{font-size:14px;color:var(--muted);font-weight:500}
.card .pct{font-size:12px;color:var(--lime);margin-top:8px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:8px 12px;color:var(--muted);font-size:13px}
.chip.on{color:var(--text);border-color:var(--lime);background:var(--lime-bg)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:8px 12px;min-width:220px}
.search input{background:none;border:0;outline:0;width:100%}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:left;font-weight:500;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.02)}
.who{display:flex;align-items:center;gap:12px;cursor:pointer;min-width:160px}
.who b{display:block;font-weight:600}.who span{color:var(--dim);font-size:12px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#0b0f08;flex:none;font-size:13px}
.goal{min-width:170px}
.goal .gt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.goal .gt b{font-weight:600}.goal .gt span{color:var(--dim)}
.goal .ctl{display:flex;align-items:center;gap:8px}
.goal .ctl .bar{flex:1}
.na{color:var(--dim);font-size:12px}
.pm{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center;font-size:16px;line-height:1;flex:none}
.pm:hover{border-color:var(--lime);color:var(--lime)}
.pm.plus{background:var(--lime);color:#0b0f08;border-color:var(--lime);font-weight:700}
.pm.plus:hover{filter:brightness(1.08);color:#0b0f08}
.pm:disabled{opacity:.35;cursor:default}
.tot{font-weight:600;white-space:nowrap}
.tot small{display:block;color:var(--dim);font-weight:400;font-size:12px}
/* right */
.right{border-left:1px solid var(--line);background:rgba(16,19,18,.75);padding:28px 22px;display:flex;flex-direction:column;gap:26px}
.right h2{font-size:18px;font-weight:600;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.right h2 span{font-size:12px;color:var(--dim);font-weight:400}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .mid{flex:1;min-width:0}
.li .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mid span{color:var(--dim);font-size:12px}
.li .r{text-align:right;font-weight:600;white-space:nowrap}
.li .r small{display:block;font-size:12px;color:var(--lime);font-weight:400}
.rank{width:22px;color:var(--dim);font-weight:600;text-align:center}
.empty{color:var(--dim);padding:18px 0;text-align:center}
/* buttons */
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--lime)}
.btn.pri{background:var(--lime);color:#0b0f08;border-color:var(--lime);font-weight:600}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:6px 10px;font-size:12px}
/* settings */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.sec h3{margin:0 0 4px;font-size:16px}
.sec p.h{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.5}
.in{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;outline:0;min-width:0}
.in:focus{border-color:var(--lime)}
.in.num{width:70px;text-align:center}
.grid-set td{padding:8px 10px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
pre.tpl{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:12px;font-size:12px;overflow:auto;color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov.show{display:flex}
.modal{background:#111513;border:1px solid var(--line2);border-radius:20px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:24px}
.modal .mh{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.modal .mh h2{margin:0;font-size:20px}
.modal .x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--muted)}
.mg{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--panel)}
.mg .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.mg .t b{font-size:15px}.mg .t span{font-size:22px;font-weight:600}
.mg .t span small{font-size:13px;color:var(--muted)}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow .in{flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:12px;border:1px solid var(--line2);border-radius:99px;padding:4px 6px 4px 10px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.tag button{background:none;border:0;color:var(--dim);padding:0 2px;font-size:14px;line-height:1}
.tag button:hover{color:var(--red)}
/* quest hero */
.quest{position:relative;overflow:hidden;border-radius:24px;padding:28px 28px 22px;margin-bottom:24px;border:1px solid rgba(255,90,31,.25);
  background:radial-gradient(600px 260px at 100% 0%,rgba(255,70,20,.32),transparent 70%),radial-gradient(500px 240px at 0% 100%,rgba(255,90,31,.18),transparent 70%),linear-gradient(135deg,#1d0c08,#0d0706)}
.quest .qtop{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--lime);margin-bottom:6px}
.quest h1{margin:0;font-size:34px;letter-spacing:-.02em;line-height:1.1}
.quest p{margin:10px 0 0;color:var(--muted);max-width:560px;line-height:1.5}
.quest p b{color:var(--text)}
.journey{display:flex;align-items:center;gap:14px;margin:30px 0 22px}
.track{flex:1;height:10px;border-radius:99px;background:repeating-linear-gradient(90deg,#3a2420 0 10px,transparent 10px 18px);position:relative}
.track>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--lime-d),var(--lime));box-shadow:0 0 18px rgba(255,90,31,.5);transition:width .9s cubic-bezier(.22,.9,.3,1)}
.plane{position:absolute;top:50%;transform:translate(-50%,-50%);transition:left .9s cubic-bezier(.22,.9,.3,1);font-size:30px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.55))}
.plane b{display:block;font-weight:400;transform:rotate(45deg)}
@media (prefers-reduced-motion:reduce){.track>i,.plane{transition:none!important}}
.isle{font-size:38px;line-height:1}
.poolhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-8px 0 0}
.poolhead small{font-size:12px;color:var(--dim)}
.poolhead b{color:#ffd23f;font-weight:600}
.journey.gold{margin:12px 0 22px}
.journey.gold .track>i{background:linear-gradient(90deg,#b8860b,#ffd23f);box-shadow:0 0 18px rgba(255,210,63,.5)}
.journey.gold .isle{visibility:hidden}
.plane.sack b{transform:none}
.coin{display:block;font-size:12px;color:#ffd23f;margin-top:2px}
.card.gold{border-color:rgba(255,210,63,.35)}
.card.gold .bar>i{background:linear-gradient(90deg,#b8860b,#ffd23f)}
.card.gold .pct{color:#ffd23f}
.qstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.qstats>div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.qstats b{display:block;font-size:24px;font-weight:600}
.qstats span{color:var(--muted);font-size:12px}
.h2{font-size:18px;font-weight:600;margin:0 0 12px}
@media (max-width:820px){.quest{padding:20px}.quest h1{font-size:26px}.quest .qtop{flex-direction:column}.qstats{grid-template-columns:1fr 1fr}}
.done-badge{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;color:#0b0f08;background:linear-gradient(90deg,#ffd23f,var(--lime));border-radius:99px;padding:3px 10px;white-space:nowrap;box-shadow:0 0 14px rgba(255,90,31,.35)}
.ehead .done-badge{font-size:13px;margin:6px 0 4px}
tr.row-done td{background:rgba(255,90,31,.06)}
.sheet-mode .nav[data-view="zapis"],.sheet-mode .nav[data-view="historie"],.sheet-mode .nav[data-view="nastaveni"],.sheet-mode .navh.other{display:none}
.sheet-edit{display:inline-block;text-decoration:none;margin-bottom:18px;padding:12px 18px;font-size:15px}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 18px;min-width:220px}
.mini .gt{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:5px;color:var(--muted)}
.mini .gt>b{font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .gt span{color:var(--dim);white-space:nowrap}.mini .gt span b{color:var(--text)}
/* fire theme: condensed display type for the challenge */
.quest h1,.qstats b,.card .val,.big,.ecard .num{font-family:"Bebas Neue",Impact,"Space Grotesk",sans-serif;font-weight:400;letter-spacing:.02em}
.quest h1{font-size:52px;line-height:.95;text-transform:uppercase}
.qstats b{font-size:34px;line-height:1}
.card .val{font-size:34px}
.kicker{font-weight:700;color:#ffb21a}
.quest{border-color:rgba(255,90,31,.45);box-shadow:0 0 0 1px rgba(255,90,31,.08),0 20px 60px -20px rgba(255,60,20,.45)}
.track>i{background:linear-gradient(90deg,#d91e1e,#ff5a1f 60%,#ffb21a)}
.bar>i{background:linear-gradient(90deg,#d91e1e,#ff5a1f)}
.btn.pri,.nav.on{color:#fff;background:linear-gradient(135deg,#ff5a1f,#d91e1e);border-color:#ff5a1f}
.btn.pri:hover{filter:brightness(1.1)}
.done-badge{color:#2a0d00}
.h2{text-transform:uppercase;letter-spacing:.08em;font-size:15px;color:#ffb21a}
@media (max-width:820px){.quest h1{font-size:40px}}
/* zapis view */
.picker{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.pick{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);font-weight:500}
.pick .av{width:30px;height:30px;font-size:12px}
.pick small{color:var(--dim);font-weight:400}
.pick.on{border-color:var(--lime);background:var(--lime-bg)}
.ehead{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.ehead .av{width:56px;height:56px;font-size:18px}
.ehead h2{margin:0;font-size:24px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.ecard{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:20px;padding:20px}
.ecard .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.ecard .t b{font-size:16px}
.ecard .num{font-size:40px;font-weight:600;letter-spacing:-.02em}
.ecard .num small{font-size:16px;color:var(--muted);font-weight:500}
.ecard .pc{color:var(--lime);font-size:13px;margin-top:8px}
.ecard .addrow{display:flex;gap:10px;margin-top:16px;align-items:center}
.ecard .addrow .in{flex:1;padding:12px}
.big-pm{width:52px;height:52px;border-radius:14px;font-size:26px;flex:none;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center}
.big-pm:hover{border-color:var(--lime);color:var(--lime)}
.big-pm.plus{background:var(--lime);color:#0b0f08;border-color:var(--lime);font-weight:700}
.big-pm.plus:hover{color:#0b0f08;filter:brightness(1.08)}
.big-pm:disabled{opacity:.35;cursor:default}
.ov-row{cursor:pointer}
/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1b211e;border:1px solid var(--line2);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:var(--lime);font-weight:600}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.note{background:rgba(245,199,91,.08);border:1px solid rgba(245,199,91,.3);color:#f2dca3;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
@media (max-width:1200px){.app{grid-template-columns:210px 1fr}.right{grid-column:2;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:24px}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:14px;align-items:center;border-right:0;border-bottom:1px solid var(--line)}
  .logo{margin:0 auto 0 4px;font-size:18px}.navh,.promo{display:none}.nav{width:auto;padding:8px 10px}.nav span{display:none}
  .main{padding:20px 16px}.hero{grid-template-columns:1fr}.big{font-size:40px}
  .right{grid-column:1;grid-template-columns:1fr;padding:20px 16px}
  .search{margin-left:0;width:100%}
  .sheet-mode .nav{display:none}
  .crew thead{display:none}
  .crew tr{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .crew tr:last-child{border-bottom:0}
  .crew td{padding:0;border:0;background:none!important}
  .crew td.tot{grid-column:2;grid-row:1;text-align:right;align-self:center}
  .crew td:nth-child(2){grid-column:1/-1;grid-row:2}
  .crew tr.row-done{background:rgba(255,90,31,.06)}
  .minis{min-width:0;grid-template-columns:1fr 1fr;gap:10px 14px}
  .who{min-width:0}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:14px}.card .val{font-size:22px}
  .journey{padding-left:14px}
  .picker{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.pick{flex:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">Moje <b>Proč</b><span>.</span></div>
    <div class="navh">Menu</div>
    <a class="nav" href="#prehled" data-view="prehled"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Přehled</span></a>
    <a class="nav" href="#zapis" data-view="zapis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg><span>Zapisování</span></a>
    <a class="nav" href="#historie" data-view="historie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2.5h6v3H9z"/><path d="M9 11h6M9 15h4"/></svg><span>Historie</span></a>
    <div class="navh other">Ostatní</div>
    <a class="nav" href="#nastaveni" data-view="nastaveni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Nastavení &amp; Excel</span></a>
    <div class="promo">
      <p>Přivedl/a jsi někoho? Zapiš si <em>+1</em></p>
      <a class="btn pri" id="promoBtn" href="#zapis" style="display:inline-block;text-decoration:none">Zapsat →</a>
    </div>
  </aside>

  <main class="main" id="main"><div class="loading">Načítám data…</div></main>

  <aside class="right" id="right"></aside>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Zpět</button></div>

<script src="config.js"></script>
<script>
/* ---------------- storage: shared db when available, otherwise local ---------------- */
const COLS=["metrics","people","entries"];
const state={metrics:[],people:[],entries:[],ready:{},mode:"loading",readOnly:false,stale:false,counts:null};
const CFG=window.TRACKER_CONFIG||{};
const sheetMode=()=>state.mode==="sheet";
const ui={view:"prehled",filter:"all",q:"",person:null,last:{},flown:false};
try{ui.person=localStorage.getItem("teamtracker.person")}catch(e){}
function savePick(){try{localStorage.setItem("teamtracker.person",ui.person)}catch(e){}}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

function localStore(){
  let data={};
  try{data=JSON.parse(localStorage.getItem("teamtracker")||"{}")}catch(e){}
  COLS.forEach(c=>data[c]=data[c]||{});
  if(!Object.keys(data.people).length&&!Object.keys(data.metrics).length){ // demo data for offline use only
    data.metrics={pohovor:{name:"Lidé na pohovor",order:1},info:{name:"Lidé na infa",order:2}};
    for(let i=1;i<=9;i++)data.people["p"+i]={name:"Člen týmu "+i,order:i,targets:{pohovor:10,info:5}};
  }
  const subs={};
  const save=()=>{try{localStorage.setItem("teamtracker",JSON.stringify(data))}catch(e){}};
  const emit=c=>(subs[c]||[]).forEach(cb=>cb(Object.entries(data[c]).map(([id,v])=>({id,...v}))));
  return{
    sub(c,cb){(subs[c]=subs[c]||[]).push(cb);setTimeout(()=>emit(c))},
    async set(c,id,v){data[c][id]=v;save();emit(c)},
    async add(c,v){const id=uid();data[c][id]=v;save();emit(c);return id},
    async del(c,id){delete data[c][id];save();emit(c)}
  };
}

function remoteStore(db){
  return{
    sub(c,cb){
      const timer=setTimeout(()=>{state.stale=true;render()},10000);
      db.collection(c).onSnapshot(s=>{
        if(!s.metadata.fromCache){clearTimeout(timer);state.stale=false}
        cb(s.docs.map(d=>({id:d.id,...d.data()})));
      },err=>{clearTimeout(timer);state.stale=true;console.warn(c,err);render()});
    },
    async set(c,id,v){await db.collection(c).doc(id).set(v)},
    async add(c,v){const id=uid();await db.collection(c).doc(id).set(v);return id},
    async del(c,id){await db.collection(c).doc(id).delete()}
  };
}

/* ---------------- Google Sheets (read-only source, people edit the sheet itself) ---------------- */
let SHEET=null;
function sheetInfo(url){const m=String(url||"").match(/\/d\/([a-zA-Z0-9_-]+)/),g=String(url||"").match(/[#&?]gid=(\d+)/);return m?{id:m[1],gid:g?g[1]:"0"}:null}
const sheetEditUrl=row=>`https://docs.google.com/spreadsheets/d/${SHEET.id}/edit#gid=${SHEET.gid}${row?"&range=A"+row:""}`;
const num=v=>Math.max(0,parseFloat(String(v??"").replace(/\s/g,"").replace(",","."))||0);
const normName=n=>String(n||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
function parseCSV(t){
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){r.push(f);f=""}else if(c==="\n"){r.push(f);rows.push(r);r=[];f=""}else if(c!=="\r")f+=c}
  if(f||r.length){r.push(f);rows.push(r)}
  return rows;
}
/* One sheet: header row with task names (each spanning a "Cíl" and a "Stav" column), a row of Cíl/Stav labels, then one row per person. */
const RENAME={"info 1":"Lidé na Info 1","fa":"Analýzy",...(CFG.rename||{})};
const displayName=t=>RENAME[normName(t)]||RENAME[t]||t;
const HEAD_RANGE=CFG.headerRange||"A4:Z5",DATA_RANGE=CFG.dataRange||"A6:Z300";
const FIRST_DATA_ROW=parseInt(String(DATA_RANGE).match(/\d+/)||6,10);
function applyGrid(head,data){
  const names=head[0]||[],kinds=head[1]||[],mm={},cols=[];
  let task="";
  for(let j=1;j<Math.max(names.length,kinds.length);j++){
    if(String(names[j]||"").trim())task=String(names[j]).trim();
    const k=normName(kinds[j]);if(!task||!k)continue;
    const kind=k.startsWith("cil")?"t":(k.startsWith("stav")||k.startsWith("hotovo")||k.startsWith("splneno")?"d":null);if(!kind)continue;
    const id=slug(task);mm[id]=mm[id]||{id,name:displayName(task),order:Object.keys(mm).length+1};cols.push({j,id,kind});
  }
  const POOL=CFG.pool&&CFG.pool.task?slug(CFG.pool.task):null;
  const people=[],counts={},used={};
  data.forEach((r,ri)=>{
    const name=String(r[0]||"").trim();if(!name)return;
    let id=slug(name);if(used[id])id+="-"+(ri+FIRST_DATA_ROW);used[id]=1;
    const targets={};
    cols.forEach(c=>{const v=num(r[c.j]);if(c.kind==="t")targets[c.id]=v;else counts[id+"|"+c.id]=v});
    people.push({id,name,order:people.length+1,targets,row:ri+FIRST_DATA_ROW});
  });
  if(!cols.length)throw new Error("format");
  state.pool=null;
  if(POOL&&mm[POOL]){ // shared goal (e.g. BJ): everyone's "Stav" adds up into one pot; it also stays a personal task
    const by={};let sum=0;
    people.forEach(p=>{const v=counts[p.id+"|"+POOL]||0;if(v)by[p.id]=v;sum+=v});
    state.pool={id:POOL,title:CFG.pool.title||"Rozpočet výpravy",name:CFG.pool.label||mm[POOL].name,unit:CFG.pool.unit||CFG.pool.task,goal:Number(CFG.pool.goal)||0,sum,by};
  }
  state.metrics=Object.values(mm);state.people=people;state.counts=counts;state.entries=[];
  COLS.forEach(c=>state.ready[c]=true);state.loadedAt=Date.now();state.sheetError=null;
}
let loadingSheet=false;
async function loadSheet(){
  if(loadingSheet)return;loadingSheet=true;
  try{
    const get=async q=>{
      const res=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET.id}/gviz/tq?tqx=out:csv&headers=0&${q}&_=${Date.now()}`,{cache:"no-store"});
      const txt=await res.text();
      if(!res.ok||/^\s*</.test(txt))throw new Error("access");
      return parseCSV(txt);
    };
    // header and data are fetched separately: Google drops text cells from mostly-numeric columns
    const [h,d]=await Promise.all([get(`gid=${SHEET.gid}&range=${HEAD_RANGE}`),get(`gid=${SHEET.gid}&range=${DATA_RANGE}`)]);
    applyGrid(h,d);
  }catch(e){
    console.warn(e);
    state.sheetError=e.message==="format"?"V tabulce chybí řádek se sloupci „Cíl“ a „Stav“.":e.message==="access"?"Tabulku se nepodařilo načíst – je nasdílená „Každý, kdo má odkaz“?":"Tabulku se nepodařilo načíst – zkontroluj připojení.";
    if(!state.loadedAt)COLS.forEach(c=>state.ready[c]=true);
  }finally{loadingSheet=false;render()}
}

let store;
async function write(fn){
  if(state.readOnly){toast("Máš jen čtecí přístup.");return}
  try{return await fn()}
  catch(e){
    if(e&&e.code==="invalid_argument"){state.readOnly=true;render();toast("Nemáš oprávnění zapisovat – požádej vlastníka o přístup Contributor.")}
    else if(e&&e.code==="quota_exceeded"){toast("Databáze je plná – smaž staré záznamy v Historii.")}
    else{toast("Uložení se nepovedlo, zkus to znovu.");console.warn(e)}
  }
}

async function init(){
  let db=null;
  SHEET=sheetInfo(CFG.sheetUrl);
  if(SHEET){
    state.mode="sheet";document.body.classList.add("sheet-mode");
    const pb=document.getElementById("promoBtn");pb.href=sheetEditUrl();pb.target="_blank";pb.rel="noopener";pb.textContent="Zapsat splnění →";
    if(ui.view!=="prehled")location.hash="prehled";
    await loadSheet();
    setInterval(()=>{if(!document.hidden)loadSheet()},30000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadSheet()});
    return;
  }
  try{if(window.claude&&typeof claude.use==="function")db=await claude.use("db")}catch(e){}
  store=db?remoteStore(db):localStore();
  state.mode=db?"shared":"local";
  COLS.forEach(c=>store.sub(c,list=>{state[c]=list;state.ready[c]=true;render()}));
}

/* ---------------- helpers ---------------- */
const PALETTE=["#f7a53b","#7c8cff","#4fd1a5","#b47bff","#ff7aa2","#5fc8ff","#f5d35b","#ff9f43","#ff8f6b","#6be3d6"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const byOrder=(a,b)=>(a.order??999)-(b.order??999)||String(a.name).localeCompare(String(b.name),"cs");
const metrics=()=>[...state.metrics].sort(byOrder);
const people=()=>[...state.people].sort(byOrder);
function colorFor(id,list){const i=list.findIndex(x=>x.id===id);return PALETTE[(i<0?0:i)%PALETTE.length]}
function tgt(p,m){const t=Number((p.targets||{})[m.id]);return t>0?t:0}
function countMap(){if(state.counts)return state.counts;const m={};for(const e of state.entries){const k=e.personId+"|"+e.metricId;m[k]=(m[k]||0)+1}return m}
const isDone=st=>st.target>0&&st.done>=st.target;
const DONE_BADGE=`<span class="done-badge">🧳 Mise splněna – bal kufry!</span>`;
function pct(d,t){return t>0?Math.round(Math.min(d,t)/t*100):0}
// every task weighs the same (a goal of 600 BJ counts like a goal of 3 interviews)
function personStats(p,ms,cm){let done=0,tasks=0,frac=0,raw=0;for(const m of ms){const tt=tgt(p,m),dd=cm[p.id+"|"+m.id]||0;raw+=dd;if(tt){tasks++;frac+=Math.min(dd,tt)/tt;if(dd>=tt)done++}}return{done,target:tasks,raw,frac,pct:tasks?Math.round(frac/tasks*100):0}}
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return"právě teď";if(s<3600)return Math.floor(s/60)+" min";if(s<86400)return Math.floor(s/3600)+" h";return new Date(ts).toLocaleDateString("cs-CZ",{day:"numeric",month:"short"})}
function lidi(n){return n===1?"člověk":(n>=2&&n<=4?"lidé":"lidí")}
const bar=(p,cls="")=>`<div class="bar ${cls} ${p>=100?"done":""}"><i style="width:${p}%"></i></div>`;

/* ---------------- render ---------------- */
function render(){
  document.querySelectorAll(".nav").forEach(a=>a.classList.toggle("on",a.dataset.view===ui.view));
  const ready=COLS.every(c=>state.ready[c]);
  const main=document.getElementById("main"),right=document.getElementById("right");
  if(!ready){main.innerHTML=`<div class="loading">${state.stale?"Data se zatím nepodařilo načíst. Zkontroluj připojení.":"Načítám data…"}</div>`;right.innerHTML="";return}
  const ae=document.activeElement,keepFocus=ae&&ae.id,caret=ae&&ae.selectionStart;
  const drafts={};document.querySelectorAll("[data-lbl-for]").forEach(i=>{if(i.value)drafts[i.dataset.lblFor]=i.value});
  const lblFocus=ae&&ae.dataset&&ae.dataset.lblFor;
  if(ui.view==="zapis")main.innerHTML=viewEntry();
  else if(ui.view==="historie")main.innerHTML=viewHistory();
  else if(ui.view==="nastaveni")main.innerHTML=viewSettings();
  else main.innerHTML=viewDashboard();
  right.innerHTML=viewRight();
  const trs=main.querySelectorAll(".track[data-target]");
  trs.forEach(tr=>{ // plane / sack moves from where it was (0 on first load) to the current progress
    const t=+tr.dataset.target,els=[tr.querySelector("i"),tr.querySelector(".plane")];
    const dur=ui.flown?0.9:2.6;els.forEach(e=>e.style.transitionDuration=dur+"s");
    void tr.offsetWidth;
    els[0].style.width=t+"%";els[1].style.left=t+"%";ui.last[tr.dataset.key]=t;
  });
  if(trs.length)ui.flown=true;
  if(keepFocus==="q"){const q=document.getElementById("q");if(q){q.focus();try{q.setSelectionRange(caret,caret)}catch(e){}}}
  document.querySelectorAll("[data-lbl-for]").forEach(i=>{const v=drafts[i.dataset.lblFor];if(v)i.value=v;if(i.dataset.lblFor===lblFocus){i.focus();try{i.setSelectionRange(caret,caret)}catch(e){}}});
}

function header(title,extra){
  return`<div class="top"><h1>${title}</h1><div style="display:flex;gap:10px;align-items:center">${extra||""}</div></div>`+
    (state.sheetError?`<div class="note">${esc(state.sheetError)}</div>`:"")+
    (state.stale?`<div class="note">Data nemusí být aktuální – čekám na spojení se serverem.</div>`:"")+
    (state.readOnly?`<div class="note">Máš jen čtecí přístup. Pro přidávání požádej vlastníka o úroveň Contributor.</div>`:"");
}

function viewDashboard(){
  const ms=metrics(),ps=people(),cm=countMap();
  if(!ms.length||!ps.length)return header("Vítej v trackeru 👋")+`<div class="sec"><h3>Zatím tu nic není</h3><p class="h">Přidej lidi a úkoly v Nastavení, nebo je nahraj z Excelu.</p><a class="btn pri" href="#nastaveni" style="text-decoration:none">Otevřít nastavení</a></div>`;
  let tD=0,tT=0;const total=state.counts?Object.values(state.counts).reduce((a,b)=>a+b,0):state.entries.length;
  let fr=0,finished=0;
  ps.forEach(p=>{const s=personStats(p,ms,cm);tD+=s.done;tT+=s.target;fr+=s.frac;if(isDone(s))finished++});
  const teamPct=tT?Math.floor(fr/tT*100):0;
  const week=state.entries.filter(e=>Date.now()-(e.at||0)<7*864e5).length;
  const visMs=ms,rows=ps;

  const cards=ms.filter(m=>!(state.pool&&state.pool.id===m.id)).map((m,i)=>{
    let d=0,t=0;ps.forEach(p=>{const tt=tgt(p,m);d+=cm[p.id+"|"+m.id]||0;t+=tt});
    const p=pct(d,t);
    return`<div class="card"><div class="ic" style="background:${PALETTE[i%PALETTE.length]}">${esc(((String(m.name).trim().split(/\s+/).pop())||"?")[0].toUpperCase())}</div>
      <div class="lbl">${esc(m.name)}</div><div class="val">${d} <small>/ ${t}</small></div>${bar(p)}<div class="pct">${p} % týmového cíle</div></div>`}).join("");

  const body=rows.map(p=>{
    const s=personStats(p,ms,cm),col=colorFor(p.id,ps);
    const goals=`<td><div class="minis">${visMs.filter(m=>tgt(p,m)||cm[p.id+"|"+m.id]).map(m=>{
      const t=tgt(p,m),d=cm[p.id+"|"+m.id]||0;
      return`<div class="mini"><div class="gt"><b>${esc(m.name)}</b><span><b>${d}</b>${t?" / "+t:""}</span></div>${bar(t?pct(d,t):100)}</div>`}).join("")||`<span class="na">Bez cílů</span>`}</div></td>`;
    const fin=isDone(s);
    return`<tr class="ov-row ${fin?"row-done":""}" data-act="goPerson" data-p="${esc(p.id)}" title="${sheetMode()?"Otevřít řádek v tabulce":"Otevřít v Zapisování"}"><td><div class="who"><div class="av" style="background:${col}">${esc(initials(p.name))}</div><div><b>${esc(p.name)}</b>${fin?DONE_BADGE:`<span>${s.done} z ${s.target} úkolů splněno</span>`}</div></div></td>${goals}
      <td class="tot">${fin?"🏝️ ":""}${s.pct} %<small>${s.done} / ${s.target} úkolů</small></td></tr>`}).join("")||`<tr><td colspan="3" class="empty">Zatím nikdo</td></tr>`;

  const allDone=tT>0&&tD>=tT;
  const P=state.pool,fmt=n=>Number(n).toLocaleString("cs-CZ");
  const poolPct=P&&P.goal?Math.min(100,Math.floor(P.sum/P.goal*100)):0;
  const poolHtml=P?`<div class="poolhead"><span>💰 ${esc(P.title)} <small>· ${P.sum>=P.goal&&P.goal?"naplněno, výprava platí!":"až se naplní, výprava platí"}</small></span><b>${P.sum>=P.goal&&P.goal?"ROZPOČET NAPLNĚN – LETÍME! 🎉":`${fmt(P.sum)} / ${fmt(P.goal)} ${esc(P.unit)} · ${poolPct} %`}</b></div>
    <div class="journey gold"><div class="track" data-key="pool" data-target="${poolPct}"><i style="width:${ui.last.pool||0}%"></i><span class="plane sack" style="left:${ui.last.pool||0}%"><b>💰</b></span></div><span class="isle">🏝️</span></div>`:"";
  return`<section class="quest">
    <div class="qtop"><div><div class="kicker">🔥 Naše výzva</div><h1>Mise: Tropický ostrov 🌴</h1>
      <p>Když společně splníme všechny cíle, <b>letíme na ostrov</b>. Každý splněný kus nás posune blíž k pláži.</p></div>
      ${sheetMode()?`<a class="btn pri" href="${sheetEditUrl()}" target="_blank" rel="noopener" style="text-decoration:none;white-space:nowrap">✏️ Zapsat splnění</a>`:`<a class="btn pri" href="#zapis" style="text-decoration:none;white-space:nowrap">+ Zapsat</a>`}</div>
    <div class="journey"><div class="track" data-key="plane" data-target="${teamPct}"><i style="width:${ui.last.plane||0}%"></i><span class="plane" style="left:${ui.last.plane||0}%"><b>✈️</b></span></div><span class="isle">🏝️</span></div>
    ${poolHtml}
    <div class="qstats">
      <div><b>${teamPct} %</b><span>cesty za námi</span></div>
      <div><b>${allDone?"🛫":finished+" / "+ps.length}</b><span>${allDone?"CELÝ TÝM LETÍ NA OSTROV!":"lidí má sbaleno 🧳"}</span></div>
      <div><b>${tD} / ${tT}</b><span>splněných úkolů</span></div>
      ${sheetMode()?`<div><b>${ps.length}</b><span>členů posádky</span></div>`:`<div><b>+${week}</b><span>za posledních 7 dní</span></div>`}
    </div>
  </section>`+(state.stale||state.readOnly||state.sheetError?header(""):"")+`
  <h2 class="h2">Posádka</h2>
  <div class="tbl" style="margin-bottom:28px"><table class="crew"><thead><tr><th>Člověk</th><th>Úkoly</th><th>Celkem</th></tr></thead><tbody>${body}</tbody></table></div>
  <h2 class="h2">Týmové cíle</h2>
  <div class="cards">${P?`<div class="card gold"><div class="ic" style="background:#f5b82e">💰</div><div class="lbl">${esc(P.title)} (${esc(P.unit)})</div><div class="val">${fmt(P.sum)} <small>/ ${fmt(P.goal)}</small></div>${bar(poolPct)}<div class="pct">${poolPct} % rozpočtu</div></div>`:""}${cards}</div>`;
}

function viewRight(){
  if(sheetMode())return`<section><h2>Stav úkolů 📊</h2>
    <p class="na" style="line-height:1.6;margin:0 0 14px">Stav úkolů se vede ve sdílené tabulce a můžeš ho tam rovnou upravit. Svůj stav zapisuj do žlutých sloupců „Stav“. Kliknutím na své jméno v Posádce se otevře rovnou tvůj řádek.</p>
    <a class="btn pri" href="${sheetEditUrl()}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">✏️ Upravit v tabulce</a></section>`;
  const ms=metrics(),ps=people(),cm=countMap();
  const pmap=Object.fromEntries(ps.map(p=>[p.id,p])),mmap=Object.fromEntries(ms.map(m=>[m.id,m]));
  const recent=[...state.entries].sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,8).map(e=>{
    const p=pmap[e.personId],m=mmap[e.metricId];
    return`<div class="li"><div class="av" style="background:${colorFor(e.personId,ps)}">${esc(initials(p?p.name:"?"))}</div><div class="mid"><b>${esc(p?p.name:"Smazaný člověk")}</b><span>${esc(m?m.name:"?")}${e.label?" · "+esc(e.label):""}</span></div><div class="r" style="color:var(--lime)">+1<small style="color:var(--dim)">${ago(e.at||0)}</small></div></div>`}).join("")||`<div class="empty">Zatím žádná aktivita</div>`;
  return`<section><h2>Poslední aktivita <a href="#historie" style="font-size:12px;color:var(--lime);text-decoration:none">Vše →</a></h2>${recent}</section>`;
}

function viewEntry(){
  const ms=metrics(),ps=people(),cm=countMap();
  if(!ms.length||!ps.length)return header("Zapisování")+`<div class="sec"><h3>Nejdřív přidej lidi a úkoly</h3><a class="btn pri" href="#nastaveni" style="text-decoration:none">Otevřít nastavení</a></div>`;
  if(!ps.some(p=>p.id===ui.person))ui.person=ps[0].id;
  const p=ps.find(x=>x.id===ui.person),s=personStats(p,ms,cm);
  const picker=ps.map(x=>{const st=personStats(x,ms,cm);return`<button class="pick ${x.id===p.id?"on":""}" data-act="pick" data-p="${esc(x.id)}"><span class="av" style="background:${colorFor(x.id,ps)}">${esc(initials(x.name))}</span>${esc(x.name)} <small>${isDone(st)?"🧳":st.pct+" %"}</small></button>`}).join("");
  const sm=sheetMode();
  const cards=ms.filter(m=>!sm||tgt(p,m)||cm[p.id+"|"+m.id]).map(m=>{
    const t=tgt(p,m),d=cm[p.id+"|"+m.id]||0;
    const ents=state.entries.filter(e=>e.personId===p.id&&e.metricId===m.id).sort((a,b)=>(b.at||0)-(a.at||0));
    const pc=t?pct(d,t):(d?100:0);
    return`<div class="ecard"><div class="t"><b>${esc(m.name)}</b><span class="na">${t?"cíl "+t:"bez cíle"}</span></div>
      <div class="num">${d}<small> / ${t||"–"}</small></div>${bar(pc,"lg")}<div class="pc">${t?(d>=t?"Splněno 🎉":pc+" % · zbývá "+(t-d)):" "}</div>
      ${sm?"":`<div class="addrow"><button class="big-pm" title="Odebrat poslední" data-act="minus" data-p="${esc(p.id)}" data-m="${esc(m.id)}" ${d?"":"disabled"}>−</button><input class="in" data-lbl-for="${esc(m.id)}" placeholder="Koho? (volitelné)"><button class="big-pm plus" title="Přidat 1 člověka" data-act="plusLbl" data-p="${esc(p.id)}" data-m="${esc(m.id)}">+</button></div>`}
      ${ents.length?`<div class="tags">${ents.slice(0,30).map(e=>`<span class="tag">${esc(e.label||"bez jména")} · ${ago(e.at||0)}<button title="Smazat" data-act="delEntry" data-id="${esc(e.id)}">×</button></span>`).join("")}</div>`:""}</div>`}).join("");
  return header("Zapisování")+`<div class="picker">${picker}</div>
    <div class="ehead"><div class="av" style="background:${colorFor(p.id,ps)}">${esc(initials(p.name))}</div><div><h2>${esc(p.name)}</h2>${isDone(s)?DONE_BADGE+" ":""}<span class="na">${s.pct} % splněno · ${s.done} z ${s.target} úkolů hotovo</span></div></div>
    ${sm?`<a class="btn pri sheet-edit" href="${sheetEditUrl(p.row)}" target="_blank" rel="noopener">✏️ Zapsat splnění (můj řádek)</a>`:""}
    <div class="egrid">${cards}</div>`;
}

function viewHistory(){
  const ms=metrics(),ps=people();
  const pmap=Object.fromEntries(ps.map(p=>[p.id,p])),mmap=Object.fromEntries(ms.map(m=>[m.id,m]));
  const list=[...state.entries].filter(e=>ui.filter==="all"||e.metricId===ui.filter).sort((a,b)=>(b.at||0)-(a.at||0));
  const chips=`<button class="chip ${ui.filter==="all"?"on":""}" data-act="filter" data-id="all">Vše</button>`+ms.map(m=>`<button class="chip ${ui.filter===m.id?"on":""}" data-act="filter" data-id="${esc(m.id)}">${esc(m.name)}</button>`).join("");
  const rows=list.slice(0,500).map(e=>{const p=pmap[e.personId],m=mmap[e.metricId];return`<tr><td>${new Date(e.at||0).toLocaleString("cs-CZ",{day:"numeric",month:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"})}</td><td>${esc(p?p.name:"Smazaný člověk")}</td><td>${esc(m?m.name:"?")}</td><td>${esc(e.label||"—")}</td><td style="text-align:right"><button class="btn sm danger" data-act="delEntry" data-id="${esc(e.id)}">Smazat</button></td></tr>`}).join("");
  return header("Historie záznamů")+`<div class="toolbar">${chips}<span class="badge" style="margin-left:auto">${list.length} záznamů</span></div>
  <div class="tbl"><table><thead><tr><th>Kdy</th><th>Člověk</th><th>Úkol</th><th>Kdo přišel</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="empty">Zatím žádné záznamy</td></tr>`}</tbody></table></div>`;
}

function viewSettings(){
  const ms=metrics(),ps=people();
  const mRows=ms.map(m=>`<tr><td><input class="in" style="width:100%" data-edit="metricName" data-id="${esc(m.id)}" value="${esc(m.name)}"></td><td style="width:1%"><button class="btn sm danger" data-act="delMetric" data-id="${esc(m.id)}">Smazat</button></td></tr>`).join("");
  const pRows=ps.map(p=>`<tr><td><input class="in" style="width:100%;min-width:140px" data-edit="personName" data-id="${esc(p.id)}" value="${esc(p.name)}"></td>${ms.map(m=>`<td><input class="in num" type="number" min="0" data-edit="target" data-id="${esc(p.id)}" data-m="${esc(m.id)}" value="${tgt(p,m)||""}" placeholder="0"></td>`).join("")}<td style="width:1%"><button class="btn sm danger" data-act="delPerson" data-id="${esc(p.id)}">Smazat</button></td></tr>`).join("");
  return header("Nastavení & Excel")+`
  <div class="sec"><h3>Úkoly (typy cílů)</h3><p class="h">Např. „Lidé na pohovor“, „Lidé na infa“. Každý úkol je sloupec v přehledu.</p>
    <table class="grid-set"><tbody>${mRows}</tbody></table>
    <div class="row-actions"><input class="in" id="newMetric" placeholder="Název nového úkolu"><button class="btn pri" data-act="addMetric">+ Přidat úkol</button></div></div>
  <div class="sec"><h3>Lidé a jejich cíle</h3><p class="h">Čísla jsou cíle pro každého člověka (prázdné = úkol nemá). Ukládá se automaticky po opuštění pole.</p>
    <div class="tbl"><table class="grid-set"><thead><tr><th>Jméno</th>${ms.map(m=>`<th>${esc(m.name)}</th>`).join("")}<th></th></tr></thead><tbody>${pRows||`<tr><td class="empty" colspan="${ms.length+2}">Zatím nikdo</td></tr>`}</tbody></table></div>
    <div class="row-actions"><input class="in" id="newPerson" placeholder="Jméno nového člověka"><button class="btn pri" data-act="addPerson">+ Přidat člověka</button></div></div>
  <div class="sec"><h3>Import z Excelu</h3><p class="h">Nahraj .xlsx nebo .csv. První sloupec = jméno, další sloupce = úkoly, čísla = cíle. Existující lidi a úkoly se podle názvu aktualizují, noví se přidají. Odškrtnuté záznamy (+1) se nemažou.</p>
    <pre class="tpl">Jméno        | Lidé na pohovor | Lidé na infa
Jan Novák    | 10              | 5
Petra Malá   | 8               | 6</pre>
    <div class="row-actions"><label class="btn pri">Vybrat soubor<input type="file" id="xls" accept=".xlsx,.xls,.csv" hidden></label><span id="impMsg" class="na"></span></div></div>
  <div class="sec"><h3>Export do Excelu</h3><p class="h">Zkopíruje tabulku (jméno, splněno/cíl za každý úkol) – stačí vložit do Excelu nebo Google Sheets (Ctrl+V).</p>
    <div class="row-actions"><button class="btn" data-act="copyStats">Kopírovat přehled</button><button class="btn" data-act="copyEntries">Kopírovat všechny záznamy</button></div></div>`;
}

function closeModal(){document.getElementById("ov").classList.remove("show")}

/* ---------------- toast ---------------- */
let toastTimer,undoFn=null;
function toast(msg,undo){
  undoFn=undo||null;
  document.getElementById("toastMsg").textContent=msg;
  document.getElementById("toastUndo").style.display=undo?"":"none";
  const t=document.getElementById("toast");t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),4000);
}
document.getElementById("toastUndo").onclick=()=>{if(undoFn)undoFn();undoFn=null;document.getElementById("toast").classList.remove("show")};

/* ---------------- actions ---------------- */
async function addEntry(pId,mId,label){
  const p=state.people.find(x=>x.id===pId),m=state.metrics.find(x=>x.id===mId);
  let finishing=false;
  if(p&&m){const ms=metrics(),cm=countMap(),before=personStats(p,ms,cm),c=cm[pId+"|"+mId]||0;
    finishing=!isDone(before)&&before.target>0&&before.done+(c<tgt(p,m)?1:0)>=before.target}
  const id=await write(()=>store.add("entries",{personId:pId,metricId:mId,label:label||"",at:Date.now()}));
  if(id)toast(finishing?`🎉 ${p.name}: Mise splněna – bal kufry! 🧳🏝️`:`+1 ${p?p.name:""} – ${m?m.name:""}`,()=>write(()=>store.del("entries",id)));
}
async function removeLast(pId,mId){
  const e=state.entries.filter(x=>x.personId===pId&&x.metricId===mId).sort((a,b)=>(b.at||0)-(a.at||0))[0];
  if(!e)return;
  const {id,...rest}=e;
  await write(()=>store.del("entries",id));
  toast("Odebrán poslední záznam",()=>write(()=>store.set("entries",id,rest)));
}
function slug(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||uid()}

const confirmState={};
function confirmTwice(key,btn,label){ // replaces confirm(), which the frame blocks
  if(confirmState[key]&&Date.now()-confirmState[key]<4000){delete confirmState[key];return true}
  confirmState[key]=Date.now();btn.textContent=label||"Opravdu?";return false;
}

document.addEventListener("click",async ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act;
  if(a==="plus")addEntry(el.dataset.p,el.dataset.m);
  else if(a==="minus")removeLast(el.dataset.p,el.dataset.m);
  else if(a==="goPerson"){
    if(sheetMode()){const p=state.people.find(x=>x.id===el.dataset.p);window.open(sheetEditUrl(p&&p.row),"_blank","noopener");return}
    ui.person=el.dataset.p;savePick();location.hash="zapis"}
  else if(a==="pick"){ui.person=el.dataset.p;savePick();render()}
  else if(a==="close")closeModal();
  else if(a==="plusLbl"){const inp=el.parentElement.querySelector("input");const v=inp.value.trim().slice(0,80);inp.value="";addEntry(el.dataset.p,el.dataset.m,v)}
  else if(a==="reload"){loadSheet()}
  else if(a==="filter"){ui.filter=el.dataset.id;render()}
  else if(a==="delEntry"){const e=state.entries.find(x=>x.id===el.dataset.id);if(!e)return;const {id,...rest}=e;await write(()=>store.del("entries",id));toast("Záznam smazán",()=>write(()=>store.set("entries",id,rest)))}
  else if(a==="addMetric"){const i=document.getElementById("newMetric"),n=i.value.trim();if(!n)return;let id=slug(n);if(state.metrics.some(m=>m.id===id))id+="-"+uid().slice(-4);await write(()=>store.set("metrics",id,{name:n,order:state.metrics.length+1}))}
  else if(a==="addPerson"){const i=document.getElementById("newPerson"),n=i.value.trim();if(!n)return;const t={};metrics().forEach(m=>t[m.id]=0);await write(()=>store.add("people",{name:n,order:state.people.length+1,targets:t}))}
  else if(a==="delMetric"){if(!confirmTwice("m"+el.dataset.id,el,"Klikni znovu – smaže i záznamy"))return;const id=el.dataset.id;for(const e of state.entries.filter(x=>x.metricId===id))await write(()=>store.del("entries",e.id));await write(()=>store.del("metrics",id))}
  else if(a==="delPerson"){if(!confirmTwice("p"+el.dataset.id,el,"Klikni znovu – smaže i záznamy"))return;const id=el.dataset.id;for(const e of state.entries.filter(x=>x.personId===id))await write(()=>store.del("entries",e.id));await write(()=>store.del("people",id))}
  else if(a==="copyStats"||a==="copyEntries"){
    const ms=metrics(),ps=people(),cm=countMap();let rows;
    if(a==="copyStats"){rows=[["Jméno",...ms.flatMap(m=>[m.name+" – splněno",m.name+" – cíl"]),"Celkem %"]];ps.forEach(p=>rows.push([p.name,...ms.flatMap(m=>[cm[p.id+"|"+m.id]||0,tgt(p,m)]),personStats(p,ms,cm).pct]))}
    else{const pm=Object.fromEntries(ps.map(p=>[p.id,p.name])),mm=Object.fromEntries(ms.map(m=>[m.id,m.name]));rows=[["Datum","Člověk","Úkol","Kdo přišel"]];[...state.entries].sort((x,y)=>(x.at||0)-(y.at||0)).forEach(e=>rows.push([new Date(e.at||0).toLocaleString("cs-CZ"),pm[e.personId]||"",mm[e.metricId]||"",e.label||""]))}
    const tsv=rows.map(r=>r.map(c=>String(c).replace(/[\t\n]/g," ")).join("\t")).join("\n");
    try{await navigator.clipboard.writeText(tsv);toast("Zkopírováno – vlož do Excelu (Ctrl+V)")}catch(e){toast("Kopírování prohlížeč nepovolil.")}
  }
});
document.getElementById("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeModal()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeModal();
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.lblFor){e.target.parentElement.querySelector('[data-act="plusLbl"]').click()}
  if(e.key==="Enter"&&(e.target.id==="newMetric"||e.target.id==="newPerson")){e.target.nextElementSibling.click()}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){ui.q=e.target.value;render()}});
document.addEventListener("change",async e=>{
  const t=e.target,k=t.dataset&&t.dataset.edit;
  if(t.id==="xls"&&t.files[0]){importFile(t.files[0]);t.value="";return}
  if(!k)return;
  if(k==="metricName"){const m=state.metrics.find(x=>x.id===t.dataset.id);const v=t.value.trim();if(m&&v&&v!==m.name){const {id,...r}=m;await write(()=>store.set("metrics",id,{...r,name:v}))}}
  if(k==="personName"){const p=state.people.find(x=>x.id===t.dataset.id);const v=t.value.trim();if(p&&v&&v!==p.name){const {id,...r}=p;await write(()=>store.set("people",id,{...r,name:v}))}}
  if(k==="target"){const p=state.people.find(x=>x.id===t.dataset.id);if(!p)return;const v=Math.max(0,parseInt(t.value,10)||0);const {id,...r}=p;await write(()=>store.set("people",id,{...r,targets:{...(r.targets||{}),[t.dataset.m]:v}}))}
});

/* ---------------- Excel import ---------------- */
let xlsxLib=null;
function loadXlsx(){
  if(xlsxLib)return xlsxLib;
  xlsxLib=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>{xlsxLib=null;rej(new Error("load"))};document.head.appendChild(s)});
  return xlsxLib;
}
async function importFile(file){
  const msg=document.getElementById("impMsg");const say=s=>{if(msg)msg.textContent=s};
  say("Načítám…");
  try{
    const XLSX=await loadXlsx();
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false}).filter(r=>r.some(c=>String(c??"").trim()));
    if(rows.length<2)throw new Error("Soubor nemá žádná data.");
    const head=rows[0].map(c=>String(c??"").trim());
    const mIds=[];
    for(let i=1;i<head.length;i++){
      if(!head[i]){mIds.push(null);continue}
      let m=state.metrics.find(x=>x.name.toLowerCase()===head[i].toLowerCase());
      let id=m?m.id:slug(head[i]);
      if(!m){if(state.metrics.some(x=>x.id===id))id+="-"+uid().slice(-4);await write(()=>store.set("metrics",id,{name:head[i],order:state.metrics.length+i}))}
      mIds.push(id);
    }
    let added=0,updated=0;
    for(const r of rows.slice(1)){
      const name=String(r[0]??"").trim();if(!name)continue;
      const ex=state.people.find(p=>String(p.name).toLowerCase()===name.toLowerCase());
      const targets={...(ex&&ex.targets||{})};
      mIds.forEach((id,i)=>{if(id){const v=parseInt(r[i+1],10);targets[id]=v>0?v:0}});
      if(ex){const {id,...rest}=ex;await write(()=>store.set("people",id,{...rest,targets}));updated++}
      else{await write(()=>store.add("people",{name,order:state.people.length+added+1,targets}));added++}
    }
    say(`Hotovo: ${added} nových, ${updated} aktualizovaných lidí.`);toast("Import dokončen");
  }catch(e){say(e.message==="load"?"Nepodařilo se načíst knihovnu pro Excel.":("Import selhal: "+e.message))}
}

/* ---------------- routing ---------------- */
function route(){window.scrollTo(0,0);ui.last={};ui.flown=false;const h=location.hash.slice(1);ui.view=(sheetMode()?["prehled"]:["prehled","zapis","historie","nastaveni"]).includes(h)?h:"prehled";ui.filter="all";render()}
window.addEventListener("hashchange",route);
setInterval(()=>{if(ui.view==="prehled"&&!document.activeElement.matches("input"))render()},60000); // refresh "x min" labels
route();
init();
</script>
